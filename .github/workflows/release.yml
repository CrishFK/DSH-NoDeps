name: Release

# Builds the Windows installer and the Linux .tar.gz and publishes them as a GitHub release when a version tag is
# pushed:
#   git tag v2.0.0 && git push origin v2.0.0
# Tags like v2.0.0-rc.1 are published as pre-releases.
# "Run workflow" (manual) only builds both and keeps them as downloadable artifacts; nothing is released.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Work out the version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
              echo "Tag '$GITHUB_REF_NAME' must look like v1.2.3 or v1.2.3-rc.1" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
          else
            version=0.0.0-dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Electron and the packaging tools are downloaded once and reused until package-lock.json changes.
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-windows-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-windows-

      # Inno Setup is only a build tool, kept in the cache once installed.
      - uses: actions/cache@v4
        id: inno
        with:
          path: ${{ runner.temp }}\InnoSetup
          key: innosetup-6.7.3

      # Use the official release and check its signature before running it.
      - name: Install Inno Setup
        if: steps.inno.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $exe
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Unexpected Inno Setup signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', "/DIR=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw 'Inno Setup did not install' }

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./installer/build.ps1 -Iscc $env:ISCC -Version $env:VERSION

      - name: Checksum
        shell: pwsh
        run: |
          $file = 'installer/Output/DSH-NoDeps-Setup.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  DSH-NoDeps-Setup.exe" | Out-File "$file.sha256" -Encoding ascii
          Get-Content "$file.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/Output/DSH-NoDeps-Setup.exe
            installer/Output/DSH-NoDeps-Setup.exe.sha256
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Electron and the packaging tools are downloaded once and reused until package-lock.json changes.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-linux-

      - name: Build the Linux package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm ci
          npx electron-builder --linux --x64 --dir --publish never "-c.extraMetadata.version=$VERSION"
          scripts/package-linux.sh

      - name: Checksum
        working-directory: dist
        run: |
          sha256sum DSH-NoDeps-linux-x64.tar.gz > DSH-NoDeps-linux-x64.tar.gz.sha256
          cat DSH-NoDeps-linux-x64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/DSH-NoDeps-linux-x64.tar.gz
            dist/DSH-NoDeps-linux-x64.tar.gz.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          args=(
            "$GITHUB_REF_NAME"
            out/DSH-NoDeps-Setup.exe out/DSH-NoDeps-Setup.exe.sha256
            out/DSH-NoDeps-linux-x64.tar.gz out/DSH-NoDeps-linux-x64.tar.gz.sha256
            --repo "$GITHUB_REPOSITORY"
            --title "DSH NoDeps $VERSION"
            --notes 'Unofficial launcher for the official DeepSeek Harness. Not affiliated with DeepSeek. See DISCLAIMER.md.'
            --generate-notes
          )
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
